[workspace]
resolver = "2"
members = ["crates/proto", "crates/server", "crates/web", "crates/model"]
default-members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

[profile.release.package."*"]
opt-level = 3

[profile.test]
opt-level = 2
