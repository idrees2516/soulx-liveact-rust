[package]
name = "liveact-web"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
liveact-proto = { path = "../proto" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "Performance",
    "Location",
    "MessageEvent",
    "ErrorEvent",
    "Event",
    "EventTarget",
    "InputEvent",
    "KeyboardEvent",
    "File",
    "FileList",
    "FileReader",
    "ProgressEvent",
    "DomException",
    "Navigator",
    "Blob",
    "DomRect",
    "CssStyleDeclaration",
    "HtmlImageElement",
    "BinaryType",
    "WebSocket",
    "AddEventListenerOptions",
    "AudioContext",
    "AudioContextOptions",
    "BaseAudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioNode",
    "AudioParam",
    "GainNode",
    "AudioBufferOptions",
    "console",
    "CanvasGradient",
    "AudioDestinationNode",
    "Response",
    "Request",
    "RequestInit",
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "HtmlDivElement",
    "HtmlTitleElement",
]

[package.metadata.wasm-pack.release]
wasm-opt = false
